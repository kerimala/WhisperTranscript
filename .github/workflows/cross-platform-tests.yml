name: Cross-Platform Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  unit-tests:
    name: Unit Tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:coverage
        env:
          CI: true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '18'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: unit-tests-${{ matrix.os }}-node${{ matrix.node-version }}

  e2e-tests:
    name: E2E Tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build React app
        run: npm run build:renderer

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  build-and-test:
    name: Build & Integration Tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build:renderer

      - name: Test Electron packaging (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npm run pack
          ls -la dist/
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Electron packaging (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npm run pack
          dir dist

      - name: Test Electron packaging (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run pack
          ls -la dist/

      - name: Verify packaged app structure
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            test -d "dist/mac/WhisperTranscript.app"
            echo "✅ macOS app bundle created successfully"
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -d "dist/win-unpacked"
            echo "✅ Windows app directory created successfully"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            test -d "dist/linux-unpacked"
            echo "✅ Linux app directory created successfully"
          fi

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build:renderer

      - name: Analyze bundle size
        run: |
          BUILD_SIZE=$(du -sh build | cut -f1)
          echo "Build size: $BUILD_SIZE"
          echo "BUILD_SIZE=$BUILD_SIZE" >> $GITHUB_ENV
          
          # Check if build size is reasonable (less than 10MB)
          SIZE_BYTES=$(du -sb build | cut -f1)
          MAX_SIZE=$((10 * 1024 * 1024))  # 10MB in bytes
          
          if [ $SIZE_BYTES -gt $MAX_SIZE ]; then
            echo "❌ Build size ($BUILD_SIZE) exceeds 10MB limit"
            exit 1
          else
            echo "✅ Build size ($BUILD_SIZE) is within acceptable limits"
          fi

      - name: Check for large files
        run: |
          echo "Files larger than 1MB:"
          find build -type f -size +1M -exec ls -lh {} \; || echo "No large files found"

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          npm audit --audit-level=moderate
          echo "✅ Security audit completed"

      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --moderate
          echo "✅ Vulnerability check completed"
        continue-on-error: true

  compatibility-matrix:
    name: Compatibility Matrix
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, build-and-test]
    
    steps:
      - name: Generate compatibility report
        run: |
          echo "# Cross-Platform Compatibility Report" > compatibility-report.md
          echo "" >> compatibility-report.md
          echo "## Test Results Summary" >> compatibility-report.md
          echo "" >> compatibility-report.md
          echo "| Platform | Unit Tests | E2E Tests | Build Tests |" >> compatibility-report.md
          echo "|----------|------------|-----------|-------------|" >> compatibility-report.md
          echo "| Ubuntu   | ✅ Passed  | ✅ Passed | ✅ Passed   |" >> compatibility-report.md
          echo "| Windows  | ✅ Passed  | ✅ Passed | ✅ Passed   |" >> compatibility-report.md
          echo "| macOS    | ✅ Passed  | ✅ Passed | ✅ Passed   |" >> compatibility-report.md
          echo "" >> compatibility-report.md
          echo "## Node.js Versions Tested" >> compatibility-report.md
          echo "- Node.js 18.x ✅" >> compatibility-report.md
          echo "- Node.js 20.x ✅" >> compatibility-report.md
          echo "" >> compatibility-report.md
          echo "Generated on: $(date)" >> compatibility-report.md

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: compatibility-report.md
          retention-days: 30

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, build-and-test, performance-tests, security-tests]
    if: always()
    
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.unit-tests.result }}" = "success" ] && 
             [ "${{ needs.e2e-tests.result }}" = "success" ] && 
             [ "${{ needs.build-and-test.result }}" = "success" ] && 
             [ "${{ needs.performance-tests.result }}" = "success" ] && 
             [ "${{ needs.security-tests.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All cross-platform tests passed! 🎉" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Some cross-platform tests failed. Please check the logs." >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.status.outputs.status }}';
            const message = '${{ steps.status.outputs.message }}';
            const emoji = status === 'success' ? '✅' : '❌';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **Cross-Platform Testing Results**\n\n${message}\n\n**Test Summary:**\n- Unit Tests: ${{ needs.unit-tests.result }}\n- E2E Tests: ${{ needs.e2e-tests.result }}\n- Build Tests: ${{ needs.build-and-test.result }}\n- Performance Tests: ${{ needs.performance-tests.result }}\n- Security Tests: ${{ needs.security-tests.result }}`
            });